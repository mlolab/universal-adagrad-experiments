[tool.poetry]
name = "universal-adagrad"
version = "0.1.0"
description = "This is the official pytorch implementation of the experiments in the paper of: Universality of AdaGrad Stepsizes for Stochastic Optimization: Inexact Oracle, Acceleration and Variance Reduction."
authors = ["Xiaowen Jiang, Anton Rodomanov, Sebastian U. Stich"]
readme = "README.md"
packages = [{include = "universal_adagrad", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^2.1.3"
torch = "^2.5.1"
tqdm = "^4.67.1"
torchvision = "^0.20.1"
scikit-learn = "^1.5.2"
scipy = "^1.14.1"
urllib3 = "^2.2.3"
haven-ai = "^0.7.3"
pandas = "^2.2.3"
matplotlib = "^3.9.3"
pooch = "^1.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ruff = "^0.8.2"

[tool.poetry.scripts]
reproduce-experiments = "universal_adagrad.reproduce_exp:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
